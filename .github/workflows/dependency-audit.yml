name: Dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the public repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        id: audit
        shell: bash
        run: |
          if cargo audit --format terminal; then
            audit_status=0
          else
            audit_status=$?
          fi

          if cargo audit --format json > cargo-audit.json; then
            json_status=0
          else
            json_status=$?
          fi

          if [ ! -s cargo-audit.json ]; then
            echo "::error::cargo audit did not produce a JSON report (exit code $json_status)."
            exit "$json_status"
          fi

          exit "$audit_status"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit-${{ github.run_id }}
          path: cargo-audit.json
          if-no-files-found: error
