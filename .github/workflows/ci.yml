name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-stub:
    name: Public stub checks
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RALGRUM_MURGLAR_PRIVATE_DIR: target/no-private-backend
    steps:
      - name: Check out the public repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Cache ASIO toolchain
        uses: actions/cache@v4
        with:
          path: |
            vendor/libclang
          key: asio-toolchain-${{ runner.os }}-${{ hashFiles('scripts/setup-asio-toolchain.ps1') }}

      - name: Set up the ASIO toolchain
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-asio-toolchain.ps1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --package ralgrum-gpui -- --check

      - name: Check Cargo metadata
        run: cargo metadata --locked --no-deps

      - name: Reject source-text tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/check-test-quality.ps1

      # cargo test compiles all targets, so a separate cargo check would duplicate work.
      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --no-deps -- -D warnings
