name: Set up the full Linux build
description: Installs the system libraries ralgruM needs on Linux and the private murglar submodule.
inputs:
  private-token:
    description: Token with read access to kekkodance/ralgrum-murglar-private. Leave empty to skip the private submodule and build the public stub.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libasound2-dev \
          libdbus-1-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libxkbcommon-dev \
          libwayland-dev \
          libxcb1-dev \
          libxrandr-dev \
          libxi-dev \
          libxcursor-dev \
          libxdamage-dev \
          libxinerama-dev \
          libgbm-dev \
          libdrm-dev \
          libegl-dev \
          libvulkan-dev \
          pkg-config \
          desktop-file-utils

    - name: Check out the private murglar submodule
      if: ${{ inputs.private-token != '' }}
      shell: bash
      env:
        PRIVATE_TOKEN: ${{ inputs.private-token }}
      run: |
        git config --global url."https://${PRIVATE_TOKEN}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --recursive src/murglar_backend/implementation
        git config --global --unset url."https://${PRIVATE_TOKEN}@github.com/".insteadOf

    - name: Install stable Rust
      uses: dtolnay/rust-toolchain@stable
