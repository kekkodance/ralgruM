name: Set up the full Linux build
description: Installs the system libraries ralgruM needs on Linux and the private murglar submodule.
inputs:
  private-token:
    description: Token with read access to kekkodance/ralgrum-murglar-private. Leave empty to skip the private submodule and build the public stub.
    required: false
    default: ''
  cache-key:
    description: Stable cache namespace for this job. Leave empty to use the default key.
    required: false
    default: ''
  cache-save-if:
    description: Whether to save fresh dependency caches. Empty saves the apt cache and keeps rust-cache's default.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # The system apt archive directory is root-owned, so the cache lives in
    # runner.temp and is copied into place before installing. The week in the
    # key refreshes the archive as Ubuntu ships package updates.
    - name: Compute apt cache week
      id: apt-cache-week
      shell: bash
      run: echo "week=$(date -u +%Y-%W)" >> "$GITHUB_OUTPUT"

    - name: Restore apt package cache
      id: apt-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/apt-archives
        key: apt-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key }}-${{ steps.apt-cache-week.outputs.week }}-${{ hashFiles('.github/actions/setup-linux/action.yml') }}
        restore-keys: |
          apt-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key }}-${{ steps.apt-cache-week.outputs.week }}-
          apt-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key }}-

    - name: Install Linux build dependencies
      shell: bash
      env:
        APT_ARCHIVES: ${{ runner.temp }}/apt-archives
      run: |
        set -euo pipefail
        mkdir -p "$APT_ARCHIVES"
        if compgen -G "$APT_ARCHIVES/*.deb" > /dev/null; then
          sudo cp -n "$APT_ARCHIVES"/*.deb /var/cache/apt/archives/
        fi
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          -o APT::Keep-Downloaded-Packages=true \
          libasound2-dev \
          libdbus-1-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libwayland-dev \
          libxcb1-dev \
          libxrandr-dev \
          libxi-dev \
          libxcursor-dev \
          libxdamage-dev \
          libxinerama-dev \
          libgbm-dev \
          libdrm-dev \
          libegl-dev \
          libvulkan-dev \
          pkg-config \
          desktop-file-utils
        cp -n /var/cache/apt/archives/*.deb "$APT_ARCHIVES"/ 2>/dev/null || true

    - name: Save apt package cache
      if: ${{ steps.apt-cache.outputs.cache-hit != 'true' && (inputs.cache-save-if == '' || inputs.cache-save-if == 'true') }}
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.apt-cache.outputs.cache-primary-key }}

    - name: Check out the private murglar submodule
      if: ${{ inputs.private-token != '' }}
      shell: bash
      env:
        PRIVATE_TOKEN: ${{ inputs.private-token }}
      run: |
        git config --global url."https://${PRIVATE_TOKEN}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --recursive src/murglar_backend/implementation
        git config --global --unset url."https://${PRIVATE_TOKEN}@github.com/".insteadOf

    - name: Install stable Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.cache-save-if != '' && inputs.cache-save-if }}
