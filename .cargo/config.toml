# Build-time environment for the cpal ASIO feature (asio-sys).
# - LIBCLANG_PATH: bindgen loads libclang.dll from here when generating the
#   ASIO bindings. Populated once by running scripts/setup-asio-toolchain.ps1,
#   which fetches the libclang.dll from the libclang PyPI wheel into
#   vendor/libclang/ (gitignored, machine-local build tool).
# - CPAL_ASIO_DIR: the Steinberg ASIO SDK sources asio-sys compiles and
#   binds against. They are committed under vendor/asio-sdk and distributed
#   under the GPLv3 option of the Steinberg dual license, so every checkout
#   already has them.
[env]
LIBCLANG_PATH = { value = "vendor/libclang", relative = true }
CPAL_ASIO_DIR = { value = "vendor/asio-sdk", relative = true }
