[package]
name = "gpui"
version = "0.2.2"
edition = "2024"
authors = ["Nathan Sobo <nathan@zed.dev>"]
description = "Zed's GPU-accelerated UI framework"
repository = "https://github.com/zed-industries/zed"
publish = false
license = "Apache-2.0"
homepage = "https://gpui.rs"
readme = "README.md"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]

# Vendored from the pinned Zed checkout (5a9b9558db01a6b906cec2fb70a797affdc58cdd)
# with one local patch: the list width-change wipe retains measured item sizes so
# sidebar width animations never re-render a measured-all feed (see
# src/elements/list.rs). Workspace-inherited dependencies are inlined below with
# the exact specs from the Zed workspace manifest; the Zed-internal crates stay on
# the same bare git source so Cargo.lock keeps a single package identity.

[features]
default = ["font-kit", "wayland", "x11", "windows-manifest"]
test-support = [
    "leak-detection",
    "collections/test-support",
    "http_client/test-support",
    "wayland",
    "x11",
    "proptest",
]
bench-support = ["profiler", "dep:criterion"]
# Preserve the published feature name while consumers migrate to `bench-support`.
bench = ["bench-support"]
inspector = ["gpui_macros/inspector"]
leak-detection = ["backtrace"]
wayland = []
x11 = [
    "scap?/x11",
]
screen-capture = [
    "scap",
]
windows-manifest = ["dep:embed-resource"]
profiler = ["dep:hdrhistogram"]
stacker = ["dep:stacksafe"]

[lib]
path = "src/gpui.rs"
doctest = false

[dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
anyhow = "1.0.86"
async-task = "4.7"
backtrace = { version = "0.3", optional = true }
bitflags = "2.6.0"

collections = { git = "https://github.com/zed-industries/zed" }
criterion = { version = "0.5", features = ["html_reports"], optional = true }
ctor = "1.0.12"
derive_more = { version = "2.1.1", features = [
    "add",
    "add_assign",
    "deref",
    "deref_mut",
    "display",
    "from",
    "from_str",
    "mul",
    "mul_assign",
    "not",
] }
etagere = "0.2"
futures = "0.3.32"
futures-concurrency = "7.7.1"
gpui_macros = { git = "https://github.com/zed-industries/zed" }
gpui_shared_string = { git = "https://github.com/zed-industries/zed" }
http_client = { git = "https://github.com/zed-industries/zed" }
image = { version = "0.25.1", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
] }
inventory = "0.3.19"
itertools = "0.14.0"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
num_cpus = "1.13"
parking = "2.0.0"
parking_lot = "0.12.1"
postage = { version = "0.5", features = ["futures-traits"] }
proptest = { git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", features = [
    "attr-macro",
], optional = true }
chrono = { version = "0.4", features = ["serde"] }
profiling = "1"
rand = "0.9"
raw-window-handle = "0.6"
regex = "1.5"
refineable = { git = "https://github.com/zed-industries/zed" }
scheduler = { git = "https://github.com/zed-industries/zed" }
resvg = { version = "0.46.0", default-features = false, features = [
    "text",
    "system-fonts",
    "memmap-fonts",
    "raster-images",
] }
usvg = { version = "0.46.0", default-features = false }
ttf-parser = "0.25"
util_macros = { git = "https://github.com/zed-industries/zed" }
schemars = { version = "1.0", features = ["indexmap2"] }
seahash = "4.1"
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
async-channel = "2.5.0"
stacksafe = { version = "1.0", optional = true }
strum = { version = "0.28", features = ["derive"] }
sum_tree = { git = "https://github.com/zed-industries/zed" }
taffy = "=0.13.0"
thiserror = "2.0.12"
tracing = "0.1.40"
gpui_util = { git = "https://github.com/zed-industries/zed" }
hdrhistogram = { version = "7", default-features = false, optional = true }
waker-fn = "1.2.0"
lyon = "1.0"
pin-project = "1.1.10"
spin = "0.10.0"
pollster = "0.4.0"
url = "2.2"
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
web-time = "1.1.0"
heapless = "0.9.2"
ztracing = { git = "https://github.com/zed-industries/zed" }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde", "js"] }


[target.'cfg(target_os = "macos")'.dependencies]
core-video = { version = "0.5.2", features = ["metal"] }
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "windows"))'.dependencies]
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed", optional = true }



[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Power"] }


[dev-dependencies]
backtrace = "0.3"
collections = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
env_logger = "0.11"
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
gpui_util = { git = "https://github.com/zed-industries/zed" }
lyon = { version = "1.0", features = ["extra"] }
rand = "0.9"
scheduler = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
unicode-segmentation = "1.10"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
http_client = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
proptest = { git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", features = [
    "attr-macro",
] }
reqwest_client = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen = "0.2.120"
web-sys = { version = "0.3", features = ["console"] }

[build-dependencies]
embed-resource = { version = "3.0", optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.72"

[package.metadata.cargo-shear]
ignored = [
    "bindgen",
    "font-kit",
    "getrandom",
    "objc2",
    "objc2-metal",
    "tracing",
]
ignored-paths = ["src/_ownership_and_data_flow.rs"]

