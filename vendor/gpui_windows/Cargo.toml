# Vendored from Zed c18e71c78281c01e08f5a2b82b28f6260f138fe1.
# Local behavior retained: stale atlas ID safety, suspend/session event forwarding,
# and custom window behavior.
[package]
name = "gpui_windows"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
[package.metadata]
[package.metadata.cargo-shear]
ignored = ["scap"]
[lints]
[lints.rust]
[lints.rust.unexpected_cfgs]
level = "allow"
[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lints.clippy.style]
level = "allow"
priority = -1
[lib]
path = "src/gpui_windows.rs"
doctest = false
[features]
default = ["gpui/default"]
test-support = ["gpui/test-support"]
screen-capture = ["gpui/screen-capture", "scap"]
[dependencies]
gpui = { default-features = false, git = "https://github.com/zed-industries/zed" }
[target]
[target."cfg(target_os = \"windows\")"]
[target."cfg(target_os = \"windows\")".dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_windows = { version = "0.34" }
anyhow = { version = "1.0.86" }
collections = { version = "0.1.0", git = "https://github.com/zed-industries/zed" }
dunce = { version = "1.0" }
etagere = { version = "0.2" }
futures = { version = "0.3.34" }
gpui_util = { git = "https://github.com/zed-industries/zed" }
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
itertools = { version = "0.14.0" }
log = { version = "0.4", default-features = false, features = ["std"] }
parking_lot = { version = "0.12.1" }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
raw-window-handle = { version = "0.6" }
scheduler = { git = "https://github.com/zed-industries/zed" }
smallvec = { version = "1.6", features = ["union", "const_new"] }
uuid = { version = "1.1", features = ["serde", "v5"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Data_Xml_Dom", "UI_Notifications", "UI_ViewManagement", "Wdk_System_SystemServices", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectManipulation", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Hlsl", "Win32_Media", "Win32_Security_Credentials", "Win32_Storage_Packaging_Appx", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_Pointer"] }
windows-core = { version = "0.62" }
windows-numerics = "0.3"
windows-registry = { version = "0.6.0" }
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed", optional = true }
[target."cfg(target_os = \"windows\")".build-dependencies]
windows-registry = { version = "0.6.0" }
