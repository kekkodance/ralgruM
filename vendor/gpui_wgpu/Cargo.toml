# Vendored from Zed 79fe6a645f68f8c9230578f154bf99852d9f716f.
# Later Zed revisions changed gpui_wgpu to use GPUI rendering primitives that
# the vendored GPUI does not provide, so the GPU backend stays on this revision
# while the rest of the Zed stack can move forward.
[package]
name = "gpui_wgpu"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/gpui_wgpu.rs"
doctest = false

[features]
default = []
bench-support = ["gpui/bench-support", "dep:image"]
font-kit = ["dep:font-kit"]
test-support = ["gpui/test-support", "dep:image"]

[dependencies]
gpui = { path = "../gpui" }
anyhow = "1.0.86"
bytemuck = "1"
collections = { version = "0.1.0", git = "https://github.com/zed-industries/zed" }
cosmic-text = "0.19.0"
etagere = "0.2"
itertools = "0.14.0"
image = { version = "0.25.1", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
], optional = true }
log = { version = "0.4", default-features = false, features = ["std"] }
parking_lot = "0.12.1"
profiling = "1"
raw-window-handle = "0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
swash = "0.2.6"
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }
unicode-segmentation = "1.10"
gpui_util = { git = "https://github.com/zed-industries/zed" }

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", default-features = false, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "3b3506ea31154edc04de64debda0e780cba2639c", default-features = false, features = ["std", "metal", "gles", "vulkan", "wgsl", "webgpu"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "3b3506ea31154edc04de64debda0e780cba2639c", default-features = true }
